name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# allow the workflow to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; queued runs supersede each other
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Source stays readable; only the published copy is minified.
      # Top-level names are untouched (no bundling), so the classic scripts
      # keep sharing their globals.
      - name: Minify CSS and JS
        run: |
          npx --yes esbuild css/shell.css css/components.css \
            --minify --outdir=css --allow-overwrite
          npx --yes esbuild js/*.js --minify --outdir=js --allow-overwrite

      - name: Inline CSS
        run: python3 tools/inline-css.py

      # a fresh cache name per deploy, so clients never keep stale assets
      - name: Stamp service worker version
        run: sed -i "s/__BUILD__/${GITHUB_SHA}/" sw.js

      # the app is plain HTML/CSS/JS — the repo root is published as-is
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
